name: H2 human trial Pages

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "publish: H2 trial / cleanup: remove the trial site"
        required: true
        default: publish
        type: choice
        options:
          - publish
          - cleanup

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: h2-human-trial-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: h2-human-trial
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "This workflow must run from main." >&2
            exit 1
          fi

      - name: Check out the selected main commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: inputs.operation == 'publish'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: inputs.operation == 'publish'
        run: npm ci

      - name: Build H2 trial
        if: inputs.operation == 'publish'
        env:
          TRIAL_PATH: p403-h2-${{ github.run_id }}
          TRIAL_SOURCE_SHA: ${{ github.sha }}
        run: npm run build:h2-trial

      - name: Restore normal site
        if: inputs.operation == 'cleanup'
        run: |
          rm -rf dist
          mkdir -p dist
          cp web/index.html dist/index.html
          cp web/styles.css dist/styles.css
          cp -R web/generated dist/generated
          touch dist/.nojekyll
          printf '%s\n' 'User-agent: *' 'Disallow: /' > dist/robots.txt
          printf '%s\n' '<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>エラバレタン</title></head><body><p>ページが見つかりません。</p></body></html>' > dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write trial URL
        if: inputs.operation == 'publish'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          TRIAL_PATH: p403-h2-${{ github.run_id }}
        run: |
          echo "## H2試遊URL" >> "$GITHUB_STEP_SUMMARY"
          echo "${PAGE_URL}${TRIAL_PATH}/" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "試遊後は同じworkflowを cleanup で実行してください。" >> "$GITHUB_STEP_SUMMARY"

      - name: Write cleanup result
        if: inputs.operation == 'cleanup'
        run: |
          echo "## H2試遊ページを削除しました" >> "$GITHUB_STEP_SUMMARY"
          echo "通常Webを公開状態へ戻しました。" >> "$GITHUB_STEP_SUMMARY"
